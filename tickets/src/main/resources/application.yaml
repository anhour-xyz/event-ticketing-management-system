server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: tickets

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tickets}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9090/realms/event-ticket-platform}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/realms/event-ticket-platform/protocol/openid-connect/certs}